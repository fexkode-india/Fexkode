<!doctype html>
<html lang="en">
  <head>

    <!-- Google Tag Manager -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-NJPLTMH6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    </script>
    <!-- End Google Tag Manager -->

    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/png"
      href="/src/assets/images/Fexkode-symbol.png"
    />

    <link
      rel="apple-touch-icon"
      href="/Fexkode-symbol.png"
    />

    <title>Fexkode</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

  </head>

  <body>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

    <script>
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function(e) {
          e.preventDefault();
          document.querySelector(this.getAttribute("href")).scrollIntoView({
            behavior: "smooth"
          });
        });
      });
    </script>

  </body>
</html>
